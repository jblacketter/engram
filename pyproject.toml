[project]
name = "engram"
version = "0.1.0"
description = "Local, privacy-focused personal semantic memory system"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "django-cors-headers>=4.6,<5.0",
    "pgvector>=0.3,<0.4",
    "psycopg[binary]>=3.2,<4.0",
    "fastmcp>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "drf-spectacular>=0.28,<1.0",
    "pdfminer.six>=20231228,<20260101",
]

[project.optional-dependencies]
prod = [
    "gunicorn>=23.0,<24.0",
    "uvicorn[standard]>=0.34,<1.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engram*", "core*", "embeddings*", "mcp_server*", "api*", "intelligence*", "ingestion*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "engram.settings.development"
python_files = ["tests.py", "test_*.py"]
asyncio_mode = "auto"
