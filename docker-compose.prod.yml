services:
  nginx:
    image: nginx:1.29.4-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - staticfiles:/app/staticfiles:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - django
      - mcp

  django:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: engram.settings.production
      POSTGRES_HOST: db
      OLLAMA_BASE_URL: http://ollama:11434
      ENGRAM_IDENTITY_DIR: /identity
    volumes:
      - staticfiles:/app/staticfiles
      - ${ENGRAM_IDENTITY_HOST_DIR:-~/.engram/identity}:/identity:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: engram.settings.production
      POSTGRES_HOST: db
      OLLAMA_BASE_URL: http://ollama:11434
      ENGRAM_IDENTITY_DIR: /identity
    volumes:
      - ${ENGRAM_IDENTITY_HOST_DIR:-~/.engram/identity}:/identity:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 8080), 3)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["scheduler"]
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: engram.settings.production
      POSTGRES_HOST: db
      OLLAMA_BASE_URL: http://ollama:11434
      ENGRAM_IDENTITY_DIR: /identity
    volumes:
      - ${ENGRAM_IDENTITY_HOST_DIR:-~/.engram/identity}:/identity:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          if [ "$$(date +%u)" = "1" ]; then
            python manage.py maintenance --digest || echo "maintenance failed"
          else
            python manage.py maintenance || echo "maintenance failed"
          fi
          sleep 86400
        done

  db:
    image: pgvector/pgvector:0.8.5-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engram}
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  ollama:
    image: ollama/ollama:0.31.2
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  ollama_models:
  staticfiles:
